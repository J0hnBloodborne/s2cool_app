[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
# Drop-in for the existing 1 GB x86 demo server, not the A1 setup.
Environment=S2COOL_SMALL_DEMO=1
Environment=S2COOL_MODEL_THREADS=1
Environment=OMP_NUM_THREADS=1
Environment=OPENBLAS_NUM_THREADS=1
Environment=MKL_NUM_THREADS=1
Environment=NUMEXPR_NUM_THREADS=1
MemoryAccounting=true
MemoryHigh=350M
MemoryMax=450M
MemorySwapMax=256M
CPUQuota=35%
CPUWeight=10
IOWeight=10
Nice=10
TasksMax=64
OOMPolicy=stop
